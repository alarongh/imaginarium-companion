<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board design QA</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/lobby.css">
  <link rel="stylesheet" href="../css/game.css">
  <style>
    body { padding: 20px; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; max-width: 1280px; margin: auto; }
    .comparison figure { margin: 0; display: grid; align-content: start; gap: 10px; }
    .comparison figcaption { color: var(--text-secondary); font-weight: 750; }
    .comparison img { width: 100%; max-height: 900px; object-fit: contain; object-position: top; border-radius: 22px; background: #111; }
    .comparison .board-panel { min-height: 900px; }
  </style>
</head>
<body>
  <main class="comparison">
    <figure><figcaption>Референс пользователя</figcaption><img src="./reference-board.png" alt="Референс облачного игрового поля"></figure>
    <figure><figcaption>Реализация</figcaption><section class="panel board-panel" id="preview"></section></figure>
  </main>
  <script type="module">
    import { renderBoard } from "../js/ui/board.js";
    const colors = ["#ec6674", "#668cff", "#62ce91", "#f2b75f", "#bb73ed", "#55cbd3", "#f28a4b"];
    const positions = [0, 5, 11, 17, 23, 31, 38];
    const players = colors.map((color, index) => ({ id: `p${index}`, name: `Игрок ${index + 1}`, color, progress: positions[index] }));
    document.querySelector("#preview").innerHTML = renderBoard({ players, roundNumber: 4 });
  </script>
</body>
</html>
